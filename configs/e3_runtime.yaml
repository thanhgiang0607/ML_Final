# E3 — cấu hình theo E3.
# File này dùng n=5.000 và alpha={0.25, 0.5, 1, 2}, theo mục "C – E3".
dataset:
  centers: 5
  cluster_std: 1.0
  dimensions: 2
  random_state: 0
  reference_n: 2000
  bandwidth_quantile: 0.3
  bandwidth_n_samples: null

n_sweep:
  values: [500, 1000, 2000, 5000, 10000, 20000, 50000]

h_sweep:
  n: 5000
  alphas: [0.25, 0.5, 1.0, 2.0]

benchmark:
  # Mục C – E3 ghi median 3 lần; truyền --repeats 5 nếu nhóm chốt theo đề cương v2.
  repeats: 3
  timeout_seconds: 600
  max_iter: 300
  tol: 0.001

outputs:
  directory: results/e3
  report: report/THUC_NGHIEM_E3.md
